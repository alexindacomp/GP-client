[package]
name = "gp-connect"
description = "GP Connect — cross-platform GlobalProtect VPN client (Tauri 2 app)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Needs WebKitGTK on Linux (not available in WSL): build/check this crate on Windows/macOS or in CI.
[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
gp-core = { workspace = true, features = ["http"] }
gp-elevate = { path = "../crates/gp-elevate" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "fs"] }
tokio-util.workspace = true
url.workspace = true
uuid.workspace = true
# `macos-private-api`: transparent webview for the macOS vibrancy (app.macOSPrivateApi in tauri.conf.json).
tauri = { version = "2.12", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5"
# Default `v1` feature: Windows Credential Manager, macOS Keychain, Linux Secret Service.
keyring = "4.2"
window-vibrancy = "0.8"

[target.'cfg(windows)'.dependencies]
# Same versions as wry uses (tauri's `PlatformWebview::controller()` returns these types).
webview2-com = "0.39"
windows-core = "0.62"

[dev-dependencies]
tempfile.workspace = true
# `tauri::test::mock_context` for the IPC end-to-end tests (src/app_state/ipc_tests.rs).
tauri = { version = "2.12", features = ["test"] }

[lints]
workspace = true
