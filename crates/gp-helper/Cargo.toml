[package]
name = "gp-helper"
description = "Windows elevated helper (gp-connect-helper.exe) for GP Connect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[lib]
name = "gp_helper"
path = "src/lib.rs"

[[bin]]
name = "gp-connect-helper"
path = "src/main.rs"

[dependencies]
gp-core.workspace = true
gp-elevate = { path = "../gp-elevate" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "process", "io-util", "net"] }
url.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_LibraryLoader",
  "Win32_System_Pipes",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }

[dev-dependencies]
async-trait.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros", "process", "io-util", "net", "test-util"] }

[lints]
workspace = true
