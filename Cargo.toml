[workspace]
resolver = "3"
members = ["crates/gp-core", "crates/gp-elevate", "crates/gp-helper", "src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/alexindacomp/GP-client"
authors = ["GP Connect contributors"]

[workspace.dependencies]
gp-core = { path = "crates/gp-core", default-features = false }
async-trait = "0.1"
base64 = "0.23"
getrandom = "0.4"
hmac = "0.13"
regex = "1"
rustix = { version = "1", default-features = false, features = ["std", "process", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", default-features = false }
url = "2"
uuid = { version = "1", features = ["v4"] }
windows-sys = "0.61"

# Shared lints ("pedantic-lite"). CI runs `cargo clippy --workspace --all-targets -- -D warnings`,
# so every warning below fails the build there.
[workspace.lints.rust]
unsafe_code = "deny" # FFI crates (gp-helper, gp-elevate on Windows) allow it locally, per module.
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Too noisy for this codebase; the rest of pedantic stays on.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
similar_names = "allow"
assert_is_empty = "allow"
doc_markdown = "allow"
# Hygiene beyond pedantic.
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
unwrap_used = "warn"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
# Only binaries pick a panic strategy: in this workspace those are gp-helper and the app
# (src-tauri). Neither relies on catch_unwind; a panic must take the process down rather
# than leave the VPN engine half-updated.
panic = "abort"
